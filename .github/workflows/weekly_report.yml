name: ETF Weekly Report

on:
  # Ogni sabato alle 09:00 CET (08:00 UTC in inverno, 07:00 UTC in estate)
  schedule:
    - cron: '0 8 * * 6'   # sabato 08:00 UTC = 09:00 CET
  # Pulsante per lancio manuale da GitHub
  workflow_dispatch:
    inputs:
      email:
        description: 'Invia il report via email'
        type: boolean
        default: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # I file per il sito Ex Ante (articolo, market.json, watchlist.json) finiscono
      # in site_export/ di questo repo. È il sito (galoe2/exante) a prenderli da qui,
      # leggendo questo repo pubblico: nessun token da configurare.
      - name: Run ETF Report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Opzionali (Settings → Secrets and variables → Actions → Variables):
          # per cambiare modello Groq senza toccare il codice.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_MODEL_NEWS: ${{ vars.GROQ_MODEL_NEWS }}
          # Articolo per il sito: vuoto o "dati" = solo numeri (default), "ai" = testo Groq
          ARTICLE_MODE: ${{ vars.ARTICLE_MODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_DIR: ${{ github.workspace }}/site_export
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.email }}
        run: |
          rm -rf site_export
          if [ "$SEND_EMAIL" = "true" ]; then
            python run.py --email --post
          else
            python run.py --post
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-report
          path: output/ETF_Report_*.html
          retention-days: 90

      - name: Commit report to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/ data/ site_export/
          git diff --staged --quiet || git commit -m "Report $(date +%Y-W%V)"
          git push
