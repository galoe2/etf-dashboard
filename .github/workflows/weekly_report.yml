name: ETF Weekly Report

on:
  # Ogni sabato alle 09:00 CET (08:00 UTC in inverno, 07:00 UTC in estate)
  schedule:
    - cron: '0 8 * * 6'   # sabato 08:00 UTC = 09:00 CET
  # Pulsante per lancio manuale da GitHub
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Checkout del repo del sito Ex Ante (per pubblicare l'articolo settimanale).
      # Config necessaria su questo repo:
      #   - Variable SITE_REPO (Settings → Secrets and variables → Actions → Variables),
      #     es. "tuo-user/exante"
      #   - Secret SITE_PUSH_TOKEN: fine-grained PAT con permesso
      #     Contents: read/write sul repo del sito
      - name: Checkout blog repository
        if: ${{ vars.SITE_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SITE_REPO }}
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site

      - name: Run ETF Report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_DIR: ${{ github.workspace }}/site
        run: |
          if [ -d site ]; then
            python run.py --email --post
          else
            python run.py --email
          fi

      - name: Publish blog post
        if: ${{ vars.SITE_REPO != '' }}
        run: |
          cd site
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/blog/ src/data/ public/reports/
          git diff --staged --quiet || git commit -m "Articolo settimanale $(date +%Y-W%V)"
          git push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-report
          path: output/ETF_Report_*.html
          retention-days: 90

      - name: Commit report to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/ data/
          git diff --staged --quiet || git commit -m "Report $(date +%Y-W%V)"
          git push
